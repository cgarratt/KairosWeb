services:
  - type: web
    name: kairos-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 195 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KAIROS_WEB_USER
        value: kairos
      - key: KAIROS_WEB_PASSWORD
        sync: false
      - key: BINANCE_MCP_URL
        sync: false
      - key: HYPERLIQUID_MCP_URL
        sync: false
      - key: BINANCE_MCP_TOKEN
        sync: false
      - key: HYPERLIQUID_MCP_TOKEN
        sync: false

      - key: DATABASE_URL
        sync: false
      - key: KAIROS_SNAPSHOT_ADMIN_TOKEN
        sync: false
