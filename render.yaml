services:
  - type: web
    name: kairos-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 195 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KAIROS_WEB_USER
        value: kairos
      - key: KAIROS_WEB_PASSWORD
        sync: false
      - key: BINANCE_MCP_URL
        sync: false
      - key: HYPERLIQUID_MCP_URL
        sync: false
      - key: BINANCE_MCP_TOKEN
        sync: false
      - key: HYPERLIQUID_MCP_TOKEN
        sync: false
      - key: KAIROS_GOOGLE_SHEET_ID
        value: 1_tG5FK_u0biVZm2iXaK6fJi1enBYJYLAG6txkpTgsy8
      - key: KAIROS_GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: KAIROS_SHEETS_CACHE_SECONDS
        value: '60'
